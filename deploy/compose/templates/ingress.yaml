{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ctnr-compose.fullname" . }}
  labels:
    {{- include "ctnr-compose.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- if .Values.api.enabled }}
    - host: {{ .Values.ingress.api.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.api.path }}
            pathType: {{ .Values.ingress.api.pathType }}
            backend:
              service:
                name: {{ include "ctnr-compose.apiName" . }}
                port:
                  number: {{ .Values.api.service.port }}
    {{- end }}
    {{- if .Values.app.enabled }}
    - host: {{ .Values.ingress.app.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.app.path }}
            pathType: {{ .Values.ingress.app.pathType }}
            backend:
              service:
                name: {{ include "ctnr-compose.appName" . }}
                port:
                  number: {{ .Values.app.service.port }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
