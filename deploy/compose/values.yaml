nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

api:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/ctnr-io/api
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  env:
    CTNR_API_URL: "https://api.ctnr.io"
    CTNR_APP_URL: "https://app.ctnr.io"
    DEBUG: "false"
    LOG_LEVEL: "info"
    SUPABASE_URL: ""
    MOLLIE_API_URL: "https://api.mollie.com/v2"
    MOLLIE_MODE: "test"
    QONTO_API_URL: "https://thirdparty-sandbox.staging.qonto.co"
  secretEnv: []
  # - name: SUPABASE_ANON_KEY
  #   secretName: ctnr-secrets
  #   secretKey: SUPABASE_ANON_KEY
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

app:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/ctnr-io/app
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  api:
    host: api.ctnr.io
    path: /
    pathType: Prefix
  app:
    host: app.ctnr.io
    path: /
    pathType: Prefix
  tls: []
